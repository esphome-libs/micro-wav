name: Publish

on:
  release:
    types: [published]

# Least-privilege default; jobs widen their own scope as needed below.
permissions:
  contents: read

jobs:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    # Reads check-run conclusions via the API; no checkout, so contents is not
    # needed, but checks:read is.
    permissions:
      checks: read
    steps:
      - name: Verify CI passed on release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check that all expected CI checks passed on this commit.
          EXPECTED_CHECKS=("Pre-commit checks" "Static analysis" "Build" "Test" "Fuzz build")
          # Coalesce a null conclusion (queued/in-progress) to "pending" so the
          # failure message reads clearly rather than blank.
          CONCLUSIONS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
            --paginate --jq '.check_runs[] | .name + "=" + (.conclusion // "pending")')

          for check in "${EXPECTED_CHECKS[@]}"; do
            # Anchor on "name=" so a check name can't match another by prefix.
            matches=$(echo "$CONCLUSIONS" | grep "^${check}=" || true)
            if [ -z "$matches" ]; then
              echo "Required CI check not found: $check"
              exit 1
            fi
            all_passed=true
            while IFS= read -r match; do
              name="${match%=*}"
              conclusion="${match##*=}"
              if [ "$conclusion" != "success" ]; then
                echo "CI check '$name' did not pass: $conclusion"
                all_passed=false
              else
                echo "CI check '$name' passed"
              fi
            done <<< "$matches"
            if [ "$all_passed" != "true" ]; then
              exit 1
            fi
          done

  publish-platformio:
    name: Publish to PlatformIO
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: platformio
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - name: Install platformio
        run: pip install --upgrade platformio
      - name: Publish package
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: pio package publish --owner esphome --non-interactive

  publish-espressif:
    name: Publish to Espressif
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: espressif
    # Job-level permissions replace the top-level default, so contents:read must
    # be re-declared here for checkout alongside the OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Publish package
        uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          version: ${{ github.event.release.tag_name }}
          components: |
            micro-wav: .
          namespace: esphome
